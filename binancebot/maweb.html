<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이평선 매매</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#f4f6f9;--panel:#ffffff;--line:#e3e7ee;--text:#1f2430;--mute:#6b7280;--up:#089981;--down:#e5484d;--accent:#f0b90b;--accent-text:#a87500;--field:#f8fafc;--hover:#fff8e1;--soft:#fffbea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;color:var(--accent-text)}
header .sub{color:var(--mute);font-size:12px}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:12px;padding:12px}
.wrap>*{min-width:0}
@media(max-width:900px){.wrap{grid-template-columns:1fr}header{flex-wrap:wrap}#status{margin-left:0}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.panel h2{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:600}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
select,input{width:100%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.row{display:flex;gap:6px}.row>*{flex:1}
.tfs{display:flex;flex-wrap:wrap;gap:4px}
.tfs button{flex:1 0 30%;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 0;cursor:pointer;font:inherit}
.tfs button.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
.ma{display:grid;grid-template-columns:14px 1fr 64px 84px;gap:6px;align-items:center;margin-top:6px}
.dot{width:12px;height:12px;border-radius:50%}
.go{margin-top:12px;width:100%;background:var(--accent);color:#111;border:0;border-radius:8px;padding:9px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.chk{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px}.chk input{width:auto}
#chart{height:520px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.card .k{color:var(--mute);font-size:12px}.card .v{font-size:18px;font-weight:700;margin-top:2px}
.pos{color:var(--up)}.neg{color:var(--down)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600}
.tbl{max-height:320px;overflow:auto;margin-top:12px}
#status{color:var(--mute);font-size:12px;margin-left:auto}
#err{color:var(--down);margin-top:8px;font-size:13px}
.note{color:var(--mute);font-size:12px;margin-top:10px}
.scanrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
#sc_tfs button{flex:1 0 28%;padding:5px 0}
#sc_table th.sort{cursor:pointer;color:var(--accent-text)}#sc_table th.sort:hover{text-decoration:underline}
#sc_table tr.hit{cursor:pointer}#sc_table tr.hit:hover{background:var(--hover)}
.in{color:var(--accent-text);font-weight:700}
.live{background:var(--soft);border:1px solid var(--accent);border-radius:10px;padding:10px;margin-top:12px}
.rl{display:grid;grid-template-columns:44px 78px 1fr 84px;gap:4px;align-items:center;margin-top:4px;font-size:12px;color:var(--mute)}
.rl select,.rl input{margin:0}
.sec{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}.sec>b{display:block;font-size:12px;margin-bottom:4px}
.sec>select{margin-top:4px}
.opt{display:grid;grid-template-columns:1fr 90px;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--mute)}
.mini{flex:0 0 46px!important;background:var(--field);border:1px solid var(--line);border-radius:6px;cursor:pointer;font:inherit;font-size:12px}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}summary{cursor:pointer;font-size:13px;color:var(--accent-text);font-weight:600}
.hint{font-weight:400;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>이평선 매매</h1>
  <span class="sub">바이낸스 선물 시세 · 모의 매매 (주문 없음)</span>
  <span id="status"></span>
</header>
<div class="wrap">
  <div class="panel">
    <h2>1. 종목</h2>
    <select id="symbol"><option>BTCUSDT</option><option>ETHUSDT</option></select>
    <h2 style="margin-top:14px">2. 차트 봉 <span class="hint">(가장 작은 선의 봉으로)</span></h2>
    <div class="tfs" id="tfs"></div>
    <h2 style="margin-top:14px">3. 매매 규칙</h2>
    <div class="tfs" id="strats"><button data-k="pullback">눌림 매매</button><button data-k="cross">교차 매매</button></div>
    <div id="p-pullback">
      <div class="row" style="margin-top:8px">
        <select id="preset" title="빠른 설정"></select>
        <button class="mini" id="preset_save" title="지금 설정을 이름 붙여 저장">저장</button>
        <button class="mini" id="preset_del" title="고른 내 설정 지우기">삭제</button>
      </div>
      <div class="sec"><b>진입</b>
        <div class="rl" id="rl_pb"><span>진입선</span></div>
        <select id="entry">
          <option value="touch">선에 닿으면 바로 (지정가)</option>
          <option value="confirm">닿은 뒤 종가가 선 위로 마감하면 다음 봉 시가</option>
        </select>
        <div class="opt" id="o_entry_pct"><span>선보다 미리 %</span><input id="entry_pct" type="number" value="0" min="0" max="1" step="0.1" title="0 = 선 가격, 0.1~1"></div>
      </div>
      <div class="sec"><b>손절</b>
        <select id="stop_sel">
          <option value="none">없음</option>
          <option value="pct" selected>매수가 -%</option>
          <option value="touch">선에 닿으면</option>
          <option value="line">종가가 선 아래로 마감하면 (다음 봉 시가)</option></select>
        <div class="rl" id="rl_stop"><span>손절선</span></div>
        <div class="opt" id="o_pb_sl"><span id="pb_sl_name">손절 %</span><input id="pb_sl" type="number" value="2" min="0" step="0.1"></div>
      </div>
      <div class="sec"><b>익절</b>
        <select id="tp_sel">
          <option value="none">없음</option>
          <option value="pct">매수가 +% 지정가</option>
          <option value="touch">선에 닿으면</option></select>
        <div class="rl" id="rl_tp"><span>익절선</span></div>
        <div class="opt" id="o_pb_tp"><span>익절 %</span><input id="pb_tp" type="number" value="3" min="0" step="0.1"></div>
      </div>
      <div class="sec"><b>추가 청산</b>
        <select id="exit_sel">
          <option value="none">없음</option>
          <option value="line">종가가 선 아래로 마감하면 (다음 봉 시가)</option></select>
        <div class="rl" id="rl_exit"><span>청산선</span></div>
      </div>
    </div>
    <div id="p-cross">
      <div class="row">
        <div><label>빠른 선</label><select id="fast"><option value="1">선 1</option><option value="2">선 2</option><option value="3">선 3</option><option value="4">선 4</option></select></div>
        <div><label>느린 선</label><select id="slow"><option value="1">선 1</option><option value="2" selected>선 2</option><option value="3">선 3</option><option value="4">선 4</option></select></div>
      </div>
      <div class="row">
        <div><label>손절 % (0=없음)</label><input id="sl" type="number" value="2" min="0" step="0.5"></div>
        <div><label>익절 % (0=없음)</label><input id="tp" type="number" value="0" min="0" step="0.5"></div>
      </div>
    </div>
    <label>방향</label>
    <select id="side">
      <option value="long">롱만</option>
      <option value="short">숏만</option>
      <option value="both">롱·숏</option>
    </select>
    <details id="more"><summary>더 자세히</summary>
      <div class="p-pb-only">
        <div class="row">
          <div><label>진입 전 선 위 봉 수</label><input id="min_above" type="number" value="5" min="1" max="200"></div>
          <div><label>최대 보유 봉 (0=없음)</label><input id="max_hold" type="number" value="0" min="0"></div>
        </div>
        <label>추세 조건</label>
        <select id="trend">
          <option value="none">없음</option>
          <option value="rising">진입선이 오르는 중</option>
          <option value="above">진입선이 추세선 위 (정배열)</option>
          <option value="both">둘 다</option></select>
        <div class="rl" id="rl_trend"><span>추세선</span></div>
        <label>청산선 이탈 여유 %</label>
        <input id="exit_pct" type="number" value="0" min="0" step="0.1">
      </div>
      <div class="row">
        <div><label>수수료 한쪽 %</label><input id="fee" type="number" value="0.05" min="0" step="0.01"></div>
        <div><label>배율</label><input id="lev" type="number" value="1" min="1" max="20" step="1"></div>
      </div>
      <label>불러올 봉 개수</label>
      <input id="bars" type="number" value="1000" min="100" max="5000" step="100">
      <h2 style="margin-top:12px">차트 이평선</h2>
      <label class="chk"><input type="checkbox" id="mtf" checked> 봉별 VWMA100 만 보기 (1분~일봉 6줄)</label>
      <div id="mtf_legend" style="display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mute);margin-top:4px"></div>
      <div id="mas"></div>
      <div style="font-size:12px;color:var(--mute);margin-top:4px">선 1~4 는 교차 매매에서만 쓰고 그때만 차트에 그려요. 눌림 매매는 위에서 고른 선만 써요.</div>
    </details>
    <button class="go" id="go">계산하기</button>
    <label class="chk"><input type="checkbox" id="auto"> 자동 새로고침 (봉에 맞춰)</label>
    <div id="err"></div>
    <div class="note" id="note"></div>
  </div>
  <div>
    <div class="panel" id="scan">
      <h2>종목 찾기 · 지금 가격이 이평선 근처인 종목</h2>
      <div class="scanrow">
        <div><label>이평선</label><div class="row">
          <select id="sc_kind"><option value="vwma">VWMA (거래량가중)</option><option value="ema">EMA</option><option value="sma">MA</option></select>
          <input id="sc_len" type="number" value="100" min="1" max="1000" style="max-width:70px"></div></div>
        <div><label>봉 (여러 개 가능)</label><div class="tfs" id="sc_tfs"></div></div>
        <div><label>범위 ± %</label><input id="sc_pct" type="number" value="1" min="0.1" step="0.1"></div>
        <div><label>조건</label><select id="sc_mode"><option value="all">고른 봉 모두 범위 안</option><option value="any">하나라도 범위 안</option></select></div>
        <div><label>가격 위치</label><select id="sc_side"><option value="both">선 위·아래 모두</option><option value="above">선 위만 (롱 눌림)</option><option value="below">선 아래만 (숏 되돌림)</option></select></div>
        <div><label>24시간 거래대금 ≥ (백만$)</label><input id="sc_qv" type="number" value="1" min="0" step="1"></div>
        <div><label>평균 ATR 봉 · 개수</label><div class="row">
          <select id="sc_atr_tf"><option value="1d">일봉</option><option value="4h">4시간</option><option value="1h">1시간</option><option value="15m">15분</option><option value="5m">5분</option></select>
          <input id="sc_atr_n" type="number" value="14" min="1" max="500" style="max-width:60px"></div></div>
        <div><label>평균 ATR ≥ 가격의 % (0 = 끔)</label><input id="sc_atr_min" type="number" value="0" min="0" step="0.5"></div>
        <div><label>정렬</label><select id="sc_sort"><option value="dist">선과 가까운 순</option><option value="qv">거래대금 큰 순</option><option value="atr">평균 ATR 큰 순</option></select></div>
      </div>
      <div class="row" style="margin-top:10px;align-items:center">
        <button class="go" id="sc_go" style="margin:0;flex:0 0 140px">찾기</button>
        <label class="chk" style="margin:0"><input type="checkbox" id="sc_auto"> 1분마다 다시 찾기</label>
        <span id="sc_status" style="color:var(--mute);font-size:12px"></span>
      </div>
      <div class="tbl" style="margin-top:8px;max-height:260px"><table id="sc_table"></table></div>
    </div>
    <div class="panel" style="margin-top:12px"><div id="chart"></div></div>
    <div class="live" id="live"></div>
    <div class="cards" id="cards"></div>
    <div class="panel tbl"><table id="trades"></table></div>
  </div>
</div>
<script>
const TF=[["1m","1분"],["5m","5분"],["15m","15분"],["1h","1시간"],["4h","4시간"],["1d","일봉"]];
const TF_SEC={"1m":60,"5m":300,"15m":900,"1h":3600,"4h":14400,"1d":86400};
const COLORS=["#e0a100","#2f80ed","#9b51e0","#e05252"];
const KST=9*3600;
const REASON={cross:"교차",stop:"손절",take:"익절",line:"손절선",exit:"이탈",time:"시간"};
const DEF=[["ema",20],["sma",50],["vwma",100],["sma",200]];
let tf="1h", chart, candle, lineSeries=[], timer=null, lastSignal=null;
// 봉별 VWMA100 (작은 봉일수록 옅고 가늘게)
const MTF=[["1m","1분","#b0b7c3",1],["5m","5분","#e0a100",1],["15m","15분","#2f80ed",2],["1h","1시간","#9b51e0",2],["4h","4시간","#e05252",3],["1d","일봉","#111827",3]];
let mtfSeries={}, ruleSeries={};
const RULE_STYLE={pb:["#f0b90b","진입",0],trend:["#2f80ed","추세",2],stop:["#e5484d","손절",2],tp:["#089981","익절",2],exit:["#6b7280","청산",2]};

const saved=(()=>{try{return JSON.parse(localStorage.getItem("maweb")||"{}")}catch(e){return {}}})();

// 봉 버튼
const tfs=document.getElementById("tfs");
TF.forEach(([k,n])=>{const b=document.createElement("button");b.textContent=n;b.dataset.k=k;b.onclick=()=>{tf=k;markTf();load()};tfs.appendChild(b)});
function markTf(){[...tfs.children].forEach(b=>b.classList.toggle("on",b.dataset.k===tf))}
// 이평선 4줄
const mas=document.getElementById("mas");
DEF.forEach(([k,n],i)=>{
  const d=document.createElement("div");d.className="ma";
  d.innerHTML=`<span class="dot" style="background:${COLORS[i]}"></span>
  <select id="kind${i+1}"><option value="sma">MA (단순)</option><option value="ema">EMA (지수)</option><option value="vwma">VWMA (거래량가중)</option><option value="off">끄기</option></select>
  <input id="len${i+1}" type="number" min="1" max="1000" value="${n}">
  <select id="tf${i+1}" title="이 선을 계산할 봉"><option value="">차트 봉</option>${TF.map(([k,nm])=>`<option value="${k}">${nm}봉</option>`).join("")}</select>`;
  mas.appendChild(d);document.getElementById("kind"+(i+1)).value=k;
});
// 손절·익절·청산선: 선 종류 · 기간 · 봉을 따로
const KOPT=`<option value="sma">MA</option><option value="ema">EMA</option><option value="vwma">VWMA</option>`;
const TFOPT=`<option value="">차트 봉</option>${TF.map(([k,nm])=>`<option value="${k}">${nm}봉</option>`).join("")}`;
[["pb","vwma",100,""],["trend","sma",50,""],["stop","vwma",100,"15m"],["tp","vwma",100,"1h"],["exit","sma",20,""]].forEach(([nm,k,n,t])=>{
  const box=document.getElementById("rl_"+nm);
  box.insertAdjacentHTML("beforeend",`<select id="${nm}_kind">${KOPT}</select>
  <input id="${nm}_len" type="number" min="1" max="1000" value="${n}">
  <select id="${nm}_tf" title="이 선을 계산할 봉">${TFOPT}</select>`);
  document.getElementById(nm+"_kind").value=k;document.getElementById(nm+"_tf").value=t;
});
// 저장된 설정 되살리기
const FIELDS=["bars","fast","slow","side","sl","tp","fee","lev","kind1","len1","kind2","len2","kind3","len3","kind4","len4","tf1","tf2","tf3","tf4",
  "pb_kind","pb_len","pb_tf","min_above","trend","trend_kind","trend_len","trend_tf","entry","entry_pct",
  "stop_sel","stop_kind","stop_len","stop_tf","pb_sl","tp_sel","tp_kind","tp_len","tp_tf","pb_tp","exit_sel","exit_kind","exit_len","exit_tf","exit_pct","max_hold"];
// 빠른 설정 (차트 봉 + 눌림 매매 칸). 내 설정은 이 브라우저에 저장
const PRESETS={
  "5분 VWMA100 눌림 · 15분 VWMA100 손절 · 5분 20선 이탈":{tf:"5m",pb_kind:"vwma",pb_len:100,pb_tf:"",entry:"touch",entry_pct:0,
    stop_sel:"touch",stop_kind:"vwma",stop_len:100,stop_tf:"15m",pb_sl:0,tp_sel:"none",exit_sel:"line",exit_kind:"sma",exit_len:20,exit_tf:"",trend:"none",max_hold:0},
  "5분 VWMA100 눌림 · 손절 -2% · 익절 +4%":{tf:"5m",pb_kind:"vwma",pb_len:100,pb_tf:"",entry:"touch",entry_pct:0,
    stop_sel:"pct",pb_sl:2,tp_sel:"pct",pb_tp:4,exit_sel:"none",trend:"none",max_hold:0},
  "15분 VWMA100 눌림 · 1시간 VWMA100 손절 · 15분 20선 이탈":{tf:"15m",pb_kind:"vwma",pb_len:100,pb_tf:"",entry:"touch",entry_pct:0,
    stop_sel:"touch",stop_kind:"vwma",stop_len:100,stop_tf:"1h",pb_sl:0,tp_sel:"none",exit_sel:"line",exit_kind:"sma",exit_len:20,exit_tf:"",trend:"none",max_hold:0},
};
const myPresets=(()=>{try{return JSON.parse(localStorage.getItem("maweb_presets")||"{}")}catch(e){return {}}})();
const presetSel=document.getElementById("preset");
function fillPresets(cur){
  presetSel.innerHTML='<option value="">빠른 설정 고르기…</option><optgroup label="기본">'+Object.keys(PRESETS).map(k=>`<option value="b:${k}">${k}</option>`).join("")+
    '</optgroup><optgroup label="내 설정">'+Object.keys(myPresets).map(k=>`<option value="m:${k}">${k}</option>`).join("")+"</optgroup>";
  presetSel.value=cur||"";
}
fillPresets();
presetSel.onchange=()=>{const v=presetSel.value;if(!v)return;
  const p=v.startsWith("b:")?PRESETS[v.slice(2)]:myPresets[v.slice(2)];if(!p)return;
  Object.entries(p).forEach(([k,x])=>{if(k==="tf"){tf=x;markTf()}else{const el=document.getElementById(k);if(el)el.value=x}});
  refreshForm();load();};
document.getElementById("preset_save").onclick=()=>{
  const name=(prompt("이 설정의 이름","")||"").trim();if(!name)return;
  const p={tf};FIELDS.filter(f=>!/^(kind|len|tf)\d$|^(fast|slow|sl|tp|bars|fee|lev)$/.test(f)).forEach(f=>p[f]=document.getElementById(f).value);
  myPresets[name]=p;try{localStorage.setItem("maweb_presets",JSON.stringify(myPresets))}catch(e){}
  fillPresets("m:"+name);};
document.getElementById("preset_del").onclick=()=>{const v=presetSel.value;
  if(!v.startsWith("m:")){alert("지울 '내 설정'을 먼저 고르세요");return}
  if(!confirm(`'${v.slice(2)}' 설정을 지울까요?`))return;
  delete myPresets[v.slice(2)];try{localStorage.setItem("maweb_presets",JSON.stringify(myPresets))}catch(e){}fillPresets();};
// 고른 방법에 필요한 칸만 보이기
function show(id,on){document.getElementById(id).style.display=on?"":"none"}
function refreshForm(){
  const st=document.getElementById("stop_sel").value, tp=document.getElementById("tp_sel").value;
  show("o_entry_pct",document.getElementById("entry").value==="touch");
  show("rl_stop",st==="touch"||st==="line");show("o_pb_sl",st!=="none");
  document.getElementById("pb_sl_name").textContent=st==="pct"?"손절 %":"선에서 여유 % (0 = 선 그대로)";
  show("rl_tp",tp==="touch");show("o_pb_tp",tp==="pct");
  show("rl_exit",document.getElementById("exit_sel").value==="line");
  show("rl_trend",["above","both"].includes(document.getElementById("trend").value));
}
["stop_sel","tp_sel","exit_sel","entry","trend"].forEach(id=>document.getElementById(id).addEventListener("change",refreshForm));
// 손절 방법을 바꾸면 % 칸을 그 방법의 보통 값으로 (매수가 -% = 2, 선 = 여유 0)
document.getElementById("stop_sel").addEventListener("change",e=>{document.getElementById("pb_sl").value=e.target.value==="pct"?2:0;refreshForm()});
FIELDS.forEach(f=>{if(saved[f]!==undefined)document.getElementById(f).value=saved[f]});
refreshForm();
if(saved.mtf!==undefined)document.getElementById("mtf").checked=saved.mtf;
document.getElementById("mtf_legend").innerHTML=MTF.map(([k,n,c])=>`<span><span style="display:inline-block;width:14px;height:3px;background:${c};vertical-align:middle;margin-right:3px"></span>${n}</span>`).join("");
document.getElementById("mtf").onchange=()=>load();
if(saved.tf)tf=saved.tf;markTf();
// 매매 방식 (눌림 / 교차)
let strat=saved.strat||"pullback";
const NOTES={
  pullback:"롱: 직전 N봉(더 자세히)의 종가가 모두 진입선 위에 있다가 가격이 진입선까지 내려오면 삼 (지정가 = 직전 봉까지 끝난 선 값). 숏은 반대. 선마다 종류·기간·봉을 그 자리에서 골라요 — 차트 봉은 그중 가장 작은 봉으로 두세요. 차트에 진입선(굵은 노랑)·손절(빨강 점선)·익절(초록 점선)·청산(회색 점선)이 보여요. 산 봉에서는 손절만 확인하고 익절은 다음 봉부터 봐요. 같은 봉에서 둘 다 닿으면 손절. 추가 청산은 손절·익절과 함께 걸려요: 산 뒤 종가가 그 선 위에 한 번 있었다가 아래로 마감하면 다음 봉 시가에 팔아요. 선이 차트보다 큰 봉이면 그 큰 봉이 끝날 때의 종가로만 판단해요. 자주 쓰는 설정은 위 '빠른 설정'에서 고르거나 '저장'으로 남겨 두세요. 시각은 한국 시간.",
  cross:"빠른 선이 느린 선을 위로 넘으면 롱, 아래로 넘으면 청산(또는 숏). 교차는 봉이 끝났을 때 확인하고 다음 봉 시가에 사고판 것으로 계산해요. 같은 봉에서 손절·익절이 둘 다 닿으면 손절. 시각은 한국 시간."};
const strats=document.getElementById("strats");
[...strats.children].forEach(b=>b.onclick=()=>{strat=b.dataset.k;markStrat();load()});
function markStrat(){[...strats.children].forEach(b=>b.classList.toggle("on",b.dataset.k===strat));
  document.getElementById("p-cross").style.display=strat==="cross"?"":"none";
  document.getElementById("p-pullback").style.display=strat==="pullback"?"":"none";
  document.querySelector(".p-pb-only").style.display=strat==="pullback"?"":"none";
  document.getElementById("note").textContent=NOTES[strat];}
markStrat();

// 차트
chart=LightweightCharts.createChart(document.getElementById("chart"),{
  layout:{background:{color:"#ffffff"},textColor:"#4b5563"},
  grid:{vertLines:{color:"#f0f2f5"},horzLines:{color:"#f0f2f5"}},
  timeScale:{timeVisible:true,secondsVisible:false,borderColor:"#e3e7ee"},
  rightPriceScale:{borderColor:"#e3e7ee"},crosshair:{mode:0}});
candle=chart.addCandlestickSeries({upColor:"#089981",downColor:"#e5484d",borderVisible:false,wickUpColor:"#089981",wickDownColor:"#e5484d"});
COLORS.forEach(c=>lineSeries.push(chart.addLineSeries({color:c,lineWidth:2,priceLineVisible:false,lastValueVisible:false})));
MTF.forEach(([k,n,c,w])=>mtfSeries[k]=chart.addLineSeries({color:c,lineWidth:w,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,title:n,autoscaleInfoProvider:()=>null}));
Object.entries(RULE_STYLE).forEach(([k,[c,,st]])=>ruleSeries[k]=chart.addLineSeries({color:c,lineWidth:k==="pb"?3:2,lineStyle:st,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false}));
new ResizeObserver(()=>chart.applyOptions({width:document.getElementById("chart").clientWidth})).observe(document.getElementById("chart"));

// 종목 목록
fetch("/api/symbols").then(r=>r.json()).then(list=>{
  if(list.error)throw new Error(list.error);
  const sel=document.getElementById("symbol");sel.innerHTML="";
  let g=null,og;
  list.forEach(s=>{if(s.group!==g){g=s.group;og=document.createElement("optgroup");og.label=g==="미국 주식"?"미국 주식 토큰 (24시간 거래대금 순)":g;sel.appendChild(og)}
    const o=document.createElement("option");o.value=s.symbol;o.textContent=s.symbol.replace("USDT","");og.appendChild(o)});
  sel.value=saved.symbol||"BTCUSDT";load();
}).catch(e=>{document.getElementById("err").textContent="종목 목록 오류: "+e.message;load()});
document.getElementById("symbol").onchange=load;
document.getElementById("go").onclick=load;
document.getElementById("auto").onchange=schedule;

const fmtT=t=>{const d=new Date((t+KST)*1000);const p=n=>String(n).padStart(2,"0");
  return `${d.getUTCFullYear()%100}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`};
const fmtP=p=>p>=1000?p.toFixed(1):p>=10?p.toFixed(2):p.toFixed(4);
const pct=v=>`<span class="${v>=0?"pos":"neg"}">${v>=0?"+":""}${v.toFixed(2)}%</span>`;
const maName=l=>l?`${l.tf&&l.tf!==tf?TF.find(x=>x[0]===l.tf)[1]+" ":""}${({sma:"MA",ema:"EMA",vwma:"VWMA"})[l.kind]}${l.n}`:"-";

async function load(){
  const q={symbol:document.getElementById("symbol").value,interval:tf};
  FIELDS.forEach(f=>q[f]=document.getElementById(f).value);
  try{const old=JSON.parse(localStorage.getItem("maweb")||"{}");localStorage.setItem("maweb",JSON.stringify({...old,...q,tf,strat}))}catch(e){}
  const mtfOn=document.getElementById("mtf").checked;
  try{const old=JSON.parse(localStorage.getItem("maweb")||"{}");old.mtf=mtfOn;localStorage.setItem("maweb",JSON.stringify(old))}catch(e){}
  const p=new URLSearchParams({...q,interval:tf,strat,mtf:mtfOn?"1":"0"});
  [1,2,3,4].forEach(i=>p.set("ma"+i,q["kind"+i]==="off"?"off":`${q["kind"+i]}:${q["len"+i]}`));
  if(strat==="pullback"){
    ["pb","trend","stop","tp","exit"].forEach(nm=>p.set(nm+"_ma",`${q[nm+"_kind"]}:${q[nm+"_len"]}`));
    const st=q.stop_sel, tq=q.tp_sel;
    p.set("stop_mode",st==="none"?"pct":st);p.set("sl",st==="none"?0:q.pb_sl);
    p.set("tp_mode",tq==="touch"?"touch":"pct");p.set("tp",tq==="pct"?q.pb_tp:0);
    if(q.exit_sel!=="line")p.set("exit_ma","off");
  }
  document.getElementById("status").textContent="불러오는 중…";
  document.getElementById("err").textContent="";
  try{
    const r=await fetch("/api/run?"+p);const d=await r.json();
    if(d.error)throw new Error(d.error);
    draw(d);
    if(d.warn)document.getElementById("err").textContent=d.warn;
    document.getElementById("status").textContent=`${d.symbol} · ${TF.find(x=>x[0]===tf)[1]} · ${fmtT(Math.floor(Date.now()/1000))} 갱신`;
  }catch(e){document.getElementById("err").textContent="오류: "+e.message;document.getElementById("status").textContent=""}
  schedule();
}

function draw(d){
  const sh=t=>t+KST;
  candle.setData(d.bars.map(b=>({time:sh(b.t),open:b.o,high:b.h,low:b.l,close:b.c})));
  const toPts=vals=>vals.map((v,j)=>v==null?null:{time:sh(d.bars[j].t),value:v}).filter(Boolean);
  const mt=d.mtf&&d.mtf.lines;
  d.lines.forEach((l,i)=>lineSeries[i].setData(!mt&&d.strat==="cross"&&l?toPts(l.values):[]));
  MTF.forEach(([k])=>mtfSeries[k].setData(mt&&mt[k]?toPts(mt[k]):[]));
  const rl=d.rule_lines||{};
  Object.keys(RULE_STYLE).forEach(k=>{const l=rl[k];ruleSeries[k].applyOptions({title:l?`${RULE_STYLE[k][1]} ${maName(l)}`:""});ruleSeries[k].setData(l?toPts(l.values):[])});
  if(d.mtf&&d.mtf.error)document.getElementById("err").textContent="봉별 VWMA 일부 못 받음: "+d.mtf.error;
  const s=d.sim, markers=[];
  if(s){
    s.trades.forEach(t=>{
      const L=t.dir==="long";
      markers.push({time:sh(t.entry_time),position:L?"belowBar":"aboveBar",color:L?"#089981":"#e5484d",shape:L?"arrowUp":"arrowDown",text:L?"롱":"숏"});
      markers.push({time:sh(t.exit_time),position:L?"aboveBar":"belowBar",color:"#6b7280",shape:"circle",text:REASON[t.reason]});
    });
    if(s.open){const L=s.open.dir==="long";markers.push({time:sh(s.open.entry_time),position:L?"belowBar":"aboveBar",color:L?"#089981":"#e5484d",shape:L?"arrowUp":"arrowDown",text:L?"롱(보유)":"숏(보유)"})}
  }
  markers.sort((a,b)=>a.time-b.time);candle.setMarkers(markers);

  // 지금 상태
  const live=document.getElementById("live");
  const fl=d.lines[document.getElementById("fast").value-1], sl=d.lines[document.getElementById("slow").value-1];
  if(!s){live.innerHTML="빠른 선과 느린 선을 서로 다른 켜진 선으로 골라 주세요.";}
  else if(d.strat==="pullback"){
    const pl=(d.rule_lines||{}).pb, k=d.bars.length-2, last=d.bars[d.bars.length-1].c;
    let txt=`<b>지금</b> · 가격 ${fmtP(last)} · 진입선 ${maName(pl)} ${fmtP(pl.values[k])} (가격이 선 ${last>=pl.values[k]?"위":"아래"} ${pct((last/pl.values[k]-1)*100)})`;
    if(s.open)txt+=` · 모의 보유: <b>${s.open.dir==="long"?"롱":"숏"}</b> ${fmtP(s.open.entry)} → ${fmtP(s.open.price)} ${pct(s.open.ret_pct)}`+
      (s.open.sl?` · 손절 ${fmtP(s.open.sl)}`:"")+(s.open.tp?` · 익절 ${fmtP(s.open.tp)}`:"");
    else txt+=" · 모의 보유 없음";
    txt+=s.pending?` · <b style="color:var(--accent-text)">${s.pending}</b>`:" · 조건 안 맞음 (대기 없음)";
    if(s.pending){const key=d.symbol+tf+d.bars[d.bars.length-1].t+s.pending;
      if(lastSignal&&lastSignal!==key&&document.getElementById("auto").checked)notify(`${d.symbol} ${s.pending}`);lastSignal=key;}
    live.innerHTML=txt;
  }
  else{
    const k=d.bars.length-2, fv=fl.values[k], sv=sl.values[k];
    let txt=`<b>지금</b> · 마지막으로 끝난 봉 기준 ${maName(fl)} ${fv!=null?fmtP(fv):"-"} ${fv>sv?"&gt;":"&lt;"} ${maName(sl)} ${sv!=null?fmtP(sv):"-"} (${fv>sv?"골든크로스 쪽":"데드크로스 쪽"})`;
    if(s.open)txt+=` · 모의 보유: <b>${s.open.dir==="long"?"롱":"숏"}</b> ${fmtP(s.open.entry)} → ${fmtP(s.open.price)} ${pct(s.open.ret_pct)}`;
    else txt+=" · 모의 보유 없음";
    if(s.pending){txt+=` · <b style="color:var(--accent-text)">새 신호: 다음 봉 시가에 ${s.pending}</b>`;
      const key=d.symbol+tf+d.bars[d.bars.length-1].t+s.pending;
      if(lastSignal&&lastSignal!==key&&document.getElementById("auto").checked)notify(`${d.symbol} ${s.pending}`);
      lastSignal=key;}
    live.innerHTML=txt;
  }
  // 요약
  const st=s?s.stats:null,c=document.getElementById("cards");
  c.innerHTML=st?[["거래 수",st.n+"번"],["승률",st.win_rate.toFixed(1)+"%"],["거래당 평균",pct(st.avg_pct)],[`누적 (복리·${st.leverage}배)`,pct(st.total_pct)],["최대 낙폭",pct(st.mdd_pct)],
    ["기간",`${fmtT(d.bars[0].t).slice(0,8)} ~ ${fmtT(d.bars[d.bars.length-1].t).slice(0,8)}`]]
    .map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join(""):"";
  // 거래 표 (최근 것이 위)
  const tb=document.getElementById("trades");
  tb.innerHTML="<tr><th>진입 시각</th><th>방향</th><th>진입가</th><th>청산 시각</th><th>청산가</th><th>사유</th><th>보유 봉(산 봉 포함)</th><th>손익(배율 전)</th></tr>"+
    (s?s.trades.slice().reverse().map(t=>`<tr><td>${fmtT(t.entry_time)}</td><td>${t.dir==="long"?"롱":"숏"}</td><td>${fmtP(t.entry)}</td><td>${fmtT(t.exit_time)}</td><td>${fmtP(t.exit)}</td><td>${REASON[t.reason]}</td><td>${t.bars}</td><td>${pct(t.ret_pct)}</td></tr>`).join(""):"");
}

function schedule(){
  clearTimeout(timer);
  if(!document.getElementById("auto").checked)return;
  if("Notification"in window&&Notification.permission==="default")Notification.requestPermission();
  const sec=TF_SEC[tf], now=Date.now()/1000;
  // 봉이 끝난 직후(+3초)에 다시 계산, 최소 15초·최대 5분 간격
  const wait=Math.min(300,Math.max(15,sec-(now%sec)+3));
  timer=setTimeout(load,wait*1000);
}
// ---------------- 종목 찾기
const scTfs=document.getElementById("sc_tfs");
let scSel=new Set(saved.sc_tfs||["5m","15m"]), scTimer=null, scBusy=false;
TF.forEach(([k,n])=>{const b=document.createElement("button");b.textContent=n;b.dataset.k=k;
  b.onclick=()=>{scSel.has(k)?scSel.delete(k):scSel.add(k);markSc()};scTfs.appendChild(b)});
function markSc(){[...scTfs.children].forEach(b=>b.classList.toggle("on",scSel.has(b.dataset.k)))}
markSc();
const SC_FIELDS=["sc_kind","sc_len","sc_pct","sc_mode","sc_side","sc_qv","sc_atr_tf","sc_atr_n","sc_atr_min"];
SC_FIELDS.forEach(f=>{if(saved[f]!==undefined)document.getElementById(f).value=saved[f]});
refreshForm();
document.getElementById("sc_go").onclick=scan;
document.getElementById("sc_auto").onchange=()=>{clearInterval(scTimer);if(document.getElementById("sc_auto").checked){scan();scTimer=setInterval(scan,60000)}};
const fmtQ=v=>v>=1e9?(v/1e9).toFixed(1)+"B":v>=1e6?(v/1e6).toFixed(1)+"M":(v/1e3).toFixed(0)+"K";
async function scan(){
  if(scBusy)return;
  const tfs=TF.map(x=>x[0]).filter(k=>scSel.has(k));
  if(!tfs.length){document.getElementById("sc_status").textContent="봉을 하나 이상 고르세요";return}
  const v=f=>document.getElementById(f).value;
  try{const s=JSON.parse(localStorage.getItem("maweb")||"{}");SC_FIELDS.forEach(f=>s[f]=v(f));s.sc_tfs=tfs;localStorage.setItem("maweb",JSON.stringify(s))}catch(e){}
  const p=new URLSearchParams({ma:`${v("sc_kind")}:${v("sc_len")}`,tfs:tfs.join(","),pct:v("sc_pct"),mode:v("sc_mode"),side:v("sc_side"),min_qv:v("sc_qv"),atr_tf:v("sc_atr_tf"),atr_n:v("sc_atr_n"),atr_min:v("sc_atr_min")});
  scBusy=true;document.getElementById("sc_status").textContent="찾는 중… (종목 수에 따라 10~30초)";
  try{
    const d=await (await fetch("/api/scan?"+p)).json();
    if(d.error)throw new Error(d.error);
    scLast=d;
    document.getElementById("sc_status").textContent=`${d.checked}종목 중 ${d.found.length}개 · ${fmtT(d.time)}`;
    renderScan();
  }catch(e){document.getElementById("sc_status").textContent="오류: "+e.message}
  scBusy=false;
}
// 정렬: dist = 고른 봉 중 가장 가까운 거리, qv = 거래대금 큰 순, tf:5m = 그 봉의 거리
let scLast=null;
const scSortEl=document.getElementById("sc_sort");
function scKey(r,k){
  if(k==="qv")return -r.qv;
  if(k==="atr")return r.atr_pct==null?1e9:-r.atr_pct;
  const ds=(k.startsWith("tf:")?[r.tf[k.slice(3)]]:Object.values(r.tf)).filter(Boolean).map(x=>Math.abs(x.dist_pct));
  return ds.length?Math.min(...ds):1e9;
}
function setSort(k){
  if(![...scSortEl.options].some(o=>o.value===k)){const o=document.createElement("option");o.value=k;
    o.textContent=`${TF.find(x=>x[0]===k.slice(3))[1]}봉 거리 가까운 순`;scSortEl.appendChild(o)}
  scSortEl.value=k;
  try{const s=JSON.parse(localStorage.getItem("maweb")||"{}");s.sc_sort=k;localStorage.setItem("maweb",JSON.stringify(s))}catch(e){}
  renderScan();
}
scSortEl.onchange=()=>setSort(scSortEl.value);
if(saved.sc_sort&&saved.sc_sort.startsWith("tf:")&&TF.some(x=>x[0]===saved.sc_sort.slice(3)))setSort(saved.sc_sort);
else if(saved.sc_sort)scSortEl.value=saved.sc_sort;
function renderScan(){
  const d=scLast; if(!d)return;
  const k=scSortEl.value, name=`${({sma:"MA",ema:"EMA",vwma:"VWMA"})[d.ma.kind]}${d.ma.n}`;
  const list=[...d.found].sort((a,b)=>scKey(a,k)-scKey(b,k));
  const arrow=key=>key===k?" ▲":"";
  const head=`<tr><th>종목</th><th>가격</th>${d.tfs.map(t=>`<th class="sort" data-k="tf:${t}" title="눌러서 이 봉 거리순 정렬">${TF.find(x=>x[0]===t)[1]} ${name} 거리${arrow("tf:"+t)}</th>`).join("")}`+
    `<th class="sort" data-k="atr" title="눌러서 평균 ATR 큰 순 정렬">평균 ATR (${TF.find(x=>x[0]===d.atr.tf)[1]} ${d.atr.n}개)${k==="atr"?" ▼":""}</th>`+
    `<th class="sort" data-k="qv" title="눌러서 거래대금순 정렬">24시간 거래대금${k==="qv"?" ▼":""}</th></tr>`;
  const rows=list.map(r=>`<tr class="hit" data-s="${r.symbol}"><td>${r.symbol.replace("USDT","")}</td><td>${fmtP(r.price)}</td>`+
    d.tfs.map(t=>{const x=r.tf[t];return `<td class="${x&&x.in?"in":""}">${x?(x.dist_pct>=0?"+":"")+x.dist_pct.toFixed(2)+"%":"-"}</td>`}).join("")+
    `<td>${r.atr_pct==null?"-":r.atr_pct.toFixed(2)+"%"}</td><td>${fmtQ(r.qv)}</td></tr>`).join("");
  const tb=document.getElementById("sc_table");
  tb.innerHTML=head+(rows||`<tr><td colspan="9" style="text-align:left;color:var(--mute)">조건에 맞는 종목이 없어요</td></tr>`);
  [...tb.querySelectorAll("th.sort")].forEach(th=>th.onclick=()=>setSort(th.dataset.k));
  [...tb.querySelectorAll("tr.hit")].forEach(tr=>tr.onclick=()=>{
    document.getElementById("symbol").value=tr.dataset.s; tf=d.tfs[0]; markTf(); load();
    document.getElementById("chart").scrollIntoView({behavior:"smooth",block:"center"});});
}
function notify(msg){
  document.title="● "+msg;
  try{if("Notification"in window&&Notification.permission==="granted")new Notification("이평선 신호",{body:msg})}catch(e){}
}
</script>
</body>
